[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-headroom"
version = "0.1.0"
description = "Cited covenant extraction, reproducible evaluation, and deterministic credit monitoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "typer>=0.15,<1", "httpx>=0.28,<1", "PyYAML>=6,<7", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-socket>=0.7,<1"]

[project.scripts]
covenants = "covenants.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"

